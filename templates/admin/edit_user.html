{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit User</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="club_id" class="form-label">Club ID</label>
                    <input type="text" class="form-control" id="club_id" value="{{ user.club_id }}" disabled>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="member" {% if user.role=="member" %}selected{% endif %}>Member</option>
                        <option value="treasurer" {% if user.role=="treasurer" %}selected{% endif %}>Treasurer</option>
                        <option value="admin" {% if user.role=="admin" %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="active" name="active" {% if user.active
                        %}checked{% endif %}>
                    <label for="active" class="form-check-label">Active Account</label>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
