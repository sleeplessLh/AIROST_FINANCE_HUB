# ============================================================
# pytest 设定
# ============================================================
[pytest]

# 只忽略来自 flask_login 套件内部、已知的 utcnow() 过时警告
# 这是套件本身的问题，要等 Flask-Login 更新；其他警告仍会正常显示
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login