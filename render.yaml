services:
  - type: web
    name: airost-finance-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: airost-finance-db
    plan: free
    databaseName: airost_finance_hub
    user: airost