# Daily reminder to treasurers about claims waiting more than 3 days for review.
# Needs a TASK_TOKEN repository secret that matches TASK_TOKEN on Render.
name: Pending claim reminders

on:
  schedule:
    # 01:00 UTC = 09:00 Malaysia time
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to email treasurers about claims waiting more than 3 days
        env:
          TASK_TOKEN: ${{ secrets.TASK_TOKEN }}
        # The free Render instance may be asleep, so retry with a long timeout.
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "X-Task-Token: $TASK_TOKEN" \
            https://airost-finance-hub-4jd2.onrender.com/tasks/pending-reminders
