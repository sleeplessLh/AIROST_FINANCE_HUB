<!-- Admin 重设密码后，用户登入看到的第一页：必须先设定新密码 -->
{% extends "layout.html" %}

{% block title %}Set a new password · AIROST Finance Hub{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">

        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-subtitle">
            An administrator reset your password. Choose a new one to continue.
        </p>

        <form method="POST" action="{{ url_for('profile.set_new_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- 临时密码：Admin 当面给你的那一组 -->
            <div class="mb-3">
                <label for="temporary_password" class="form-label">Temporary password</label>
                <input type="password" class="form-control" id="temporary_password" name="temporary_password"
                    autocomplete="current-password" required autofocus>
            </div>

            <div class="mb-3">
                <label for="new_password" class="form-label">New password</label>
                <input type="password" class="form-control" id="new_password" name="new_password"
                    minlength="8" autocomplete="new-password" required>
                <div class="form-text">At least 8 characters, different from the temporary password.</div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm new password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                    minlength="8" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Save new password</button>
        </form>

        <!-- 不想现在设定：可以先登出 -->
        <form method="POST" action="{{ url_for('auth.logout') }}" class="mt-3 text-center">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-link btn-sm">Sign out</button>
        </form>

    </div>
</div>
{% endblock %}
