{% macro pager(pagination, endpoint, args) %}
{% if pagination.pages > 1 %}
<nav class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3" aria-label="Pagination">

    <small class="text-muted tabular">
        Showing {{ pagination.first }}–{{ pagination.last }} of {{ pagination.total }}
    </small>

    <ul class="pagination mb-0">
        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link"
                href="{% if pagination.has_prev %}{{ url_for(endpoint, page=pagination.prev_num, **args) }}{% else %}#{% endif %}"
                {% if not pagination.has_prev %}aria-disabled="true" tabindex="-1"{% endif %}>
                Previous
            </a>
        </li>

        <li class="page-item active" aria-current="page">
            <span class="page-link tabular">{{ pagination.page }} / {{ pagination.pages }}</span>
        </li>

        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link"
                href="{% if pagination.has_next %}{{ url_for(endpoint, page=pagination.next_num, **args) }}{% else %}#{% endif %}"
                {% if not pagination.has_next %}aria-disabled="true" tabindex="-1"{% endif %}>
                Next
            </a>
        </li>
    </ul>

</nav>
{% endif %}
{% endmacro %}
