{% extends "layout.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Edit Event</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin.edit_event', event_id=event.id) }}">
                <!-- CSRF Token -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- Event ID：仅显示，不允许修改 -->
                <div class="mb-3">
                    <label for="event_id" class="form-label">Event ID</label>
                    <input type="text" class="form-control" id="event_id" value="{{ event.id }}" disabled>
                </div>
                <!-- Event Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Event Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ event.name }}"
                        maxlength="150" required>
                </div>
                <!-- Event Description -->
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description"
                        rows="4">{{ event.description or "" }}</textarea>
                </div>
                <!-- Event Date -->
                <div class="mb-3">
                    <label for="event_date" class="form-label">Event Date</label>
                    <input type="date" class="form-control" id="event_date" name="event_date"
                        value="{{ event.event_date.isoformat() if event.event_date else '' }}">
                </div>
                <!-- Form Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin.list_events') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
